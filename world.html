<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Town — world</title>
    <link rel="stylesheet" href="/src/app/style.css" />
  </head>
  <body class="viewer world">
    <canvas id="view-canvas"></canvas>
    <div id="labels"></div>
    <div class="hud world-hud" id="hud">
      <nav class="links"><a href="./">Gallery</a><a href="./view.html">Viewer</a><b>World</b></nav>
      <h2>Tiny Town</h2>
      <div class="row" id="count">Loading…</div>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Find a building…  ( / )" autocomplete="off" spellcheck="false" />
        <ul id="results" hidden></ul>
      </div>
      <div class="views">
        <button id="rot-left" title="Rotate 90° (Q)"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3.5 6.5A5 5 0 1 1 3 10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M1 3.5l2.6 3.4 3.3-2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg> Q</button>
        <button id="rot-right" title="Rotate 90° (E)">E <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" style="transform:scaleX(-1)"><path d="M3.5 6.5A5 5 0 1 1 3 10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M1 3.5l2.6 3.4 3.3-2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <button id="reset" title="Reset view (R)">Reset view</button>
      </div>
      <div class="views toggles">
        <label><input type="checkbox" id="toggle-labels" checked /> districts</label>
        <label><input type="checkbox" id="toggle-shadows" checked /> shadows</label>
      </div>
      <div class="row help">Left-drag orbit · right-drag / WASD pan · wheel zoom · click a building</div>
    </div>
    <div class="hud info" id="info" hidden></div>
    <div class="stats" id="stats"></div>
    <div id="loading">
      <div class="box">
        <div id="loading-text">Loading buildings…</div>
        <div class="bar"><div id="progress"></div></div>
      </div>
    </div>
    <script type="module" src="/src/app/world/main.js"></script>
  </body>
</html>
